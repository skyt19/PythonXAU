[pytest]
# Pytest configuration for XAUUSD AI Farming HQ

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers
markers =
    safety: Safety-critical tests (account guard, risk limits)
    integration: Integration tests
    unit: Unit tests
    slow: Slow-running tests

# Ignore paths
norecursedirs = .git .pytest_cache __pycache__ *.egg-info

# Minimum Python version
minversion = 3.12
